<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartMeal — Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="app.css"/>
  <style>
    .search-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.68);backdrop-filter:blur(16px);border:1.5px solid rgba(255,255,255,.88);border-radius:var(--r-full);padding:9px 18px;margin-bottom:1rem;transition:all .18s;}
    .search-bar:focus-within{border-color:rgba(249,115,22,.4);box-shadow:0 0 0 3px rgba(249,115,22,.1);}
    .search-inp{border:none;outline:none;background:transparent;font-family:var(--font-b);font-size:.92rem;color:var(--n900);flex:1;}
    .search-inp::placeholder{color:var(--n400);}

    .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
    .fbtn{padding:7px 15px;border-radius:var(--r-full);border:1.5px solid rgba(255,255,255,.82);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);font-size:.82rem;font-weight:700;cursor:pointer;color:var(--n600);transition:all .18s;}
    .fbtn:hover{border-color:rgba(249,115,22,.35);color:var(--o600);}
    .fbtn.active{background:linear-gradient(135deg,var(--o600),var(--o400));border-color:transparent;color:#fff;box-shadow:0 3px 12px rgba(234,88,12,.26);}

    .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;}
    .recipe-card{
      background:rgba(255,255,255,.6);backdrop-filter:blur(20px);
      border:1.5px solid rgba(255,255,255,.85);border-radius:var(--r-xl);
      overflow:hidden;cursor:pointer;transition:all .22s;
      box-shadow:var(--sh);
    }
    .recipe-card:hover{transform:translateY(-5px) scale(1.01);box-shadow:var(--sh-lg);border-color:rgba(249,115,22,.3);}
    .recipe-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:3.8rem;background:linear-gradient(145deg,rgba(255,237,213,.8),rgba(254,243,199,.8));}
    .recipe-body{padding:12px 14px 14px;}
    .recipe-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:5px;}
    .recipe-name{font-weight:700;font-size:.92rem;color:var(--n800);line-height:1.3;flex:1;}
    .recipe-tag{font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;flex-shrink:0;}
    .tag-veg{background:rgba(34,197,94,.12);color:#15803d;}
    .tag-non{background:rgba(249,115,22,.12);color:var(--o700);}
    .tag-diet{background:rgba(59,130,246,.1);color:#1d4ed8;}
    .recipe-cal{font-size:.78rem;color:var(--o600);font-weight:700;margin-bottom:6px;}
    .macro-row{display:flex;gap:5px;flex-wrap:wrap;}
    .mp{font-size:.67rem;font-weight:700;padding:2px 7px;border-radius:var(--r-full);}
    .mp-p{background:rgba(59,130,246,.1);color:#1d4ed8;}
    .mp-c{background:rgba(234,179,8,.12);color:#92400e;}
    .mp-f{background:rgba(239,68,68,.1);color:#b91c1c;}

    .meta-txt{font-size:.82rem;color:var(--n400);font-weight:500;margin-bottom:1rem;}
    .no-results{text-align:center;padding:3rem;color:var(--n400);}
    .no-results span{font-size:2.5rem;display:block;margin-bottom:.5rem;}

    /* Recipe Detail Modal */
    .modal-bg{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:1rem;}
    .modal-bg.open{display:flex;}
    .modal{background:rgba(255,255,255,.95);backdrop-filter:blur(24px);border-radius:var(--r-xl);padding:2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:scaleIn .3s cubic-bezier(.34,1.56,.64,1);}
    @keyframes scaleIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
    .modal-close{float:right;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--n400);transition:color .18s;}
    .modal-close:hover{color:var(--n800);}
    .modal-emoji{font-size:5rem;text-align:center;display:block;margin-bottom:1rem;}
    .modal-name{font-family:var(--font-d);font-size:1.6rem;color:var(--n900);margin-bottom:.5rem;}
    .modal-macros{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:.5rem;margin:1rem 0;}
    .mm{background:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.85);border-radius:var(--r-md);padding:.65rem;text-align:center;}
    .mm-val{font-family:var(--font-d);font-size:1.1rem;font-weight:800;display:block;color:var(--o600);}
    .mm-lbl{font-size:.66rem;font-weight:700;color:var(--n400);text-transform:uppercase;letter-spacing:.04em;}
    .modal-section{margin-bottom:1rem;}
    .modal-section-title{font-size:.8rem;font-weight:800;color:var(--n500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem;}
    .ingredient-item{display:flex;align-items:center;gap:8px;padding:.4rem 0;border-bottom:.5px solid rgba(255,255,255,.5);font-size:.88rem;color:var(--n700);}
    .ingredient-item:last-child{border-bottom:none;}
    .ingredient-item::before{content:'•';color:var(--o400);font-size:1rem;}
    .step-item{display:flex;gap:10px;padding:.5rem 0;font-size:.88rem;color:var(--n700);}
    .step-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--o600),var(--o400));color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
    .add-to-meal-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;}
  </style>
</head>

    let curFilter = 'all';

    function setFilter(btn, f) {
      document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      curFilter = f;
      render();
    }

    function render() {
      const q = document.getElementById('searchInp').value.toLowerCase();
      const filtered = RECIPES.filter(r => {
        const matchF = curFilter === 'all' || r.type === curFilter;
        const matchQ = r.name.toLowerCase().includes(q);
        return matchF && matchQ;
      });

      document.getElementById('metaTxt').textContent = `Showing ${filtered.length} of ${RECIPES.length} recipes`;

      const grid = document.getElementById('recipeGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results"><span>🔍</span>No recipes found. Try a different search.</div>';
        return;
      }

      const tagMap = { veg:'Veg', 'non-veg':'Non-Veg', diet:'Diet' };
      const tagClass = { veg:'tag-veg', 'non-veg':'tag-non', diet:'tag-diet' };

      grid.innerHTML = filtered.map(r => `
        <div class="recipe-card" onclick="openRecipe(${r.id})">
          <div class="recipe-img">${r.emoji}</div>
          <div class="recipe-body">
            <div class="recipe-head">
              <div class="recipe-name">${r.name}</div>
              <span class="recipe-tag ${tagClass[r.type]}">${tagMap[r.type]}</span>
            </div>
            <div class="recipe-cal">🔥 ${r.cal} kcal · ⏱ ${r.time}</div>
            <div class="macro-row">
              <span class="mp mp-p">💪 ${r.pro}g</span>
              <span class="mp mp-c">🌾 ${r.carb}g</span>
              <span class="mp mp-f">🫒 ${r.fat}g</span>
            </div>
          </div>
        </div>`).join('');
    }

    function openRecipe(id) {
      const r = RECIPES.find(x=>x.id===id);
      if (!r) return;
      const mc = document.getElementById('modalContent');
      mc.innerHTML = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <span class="modal-emoji">${r.emoji}</span>
        <div class="modal-name">${r.name}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.5rem;">
          <span class="badge badge-o">🔥 ${r.cal} kcal</span>
          <span class="badge badge-b">⏱ ${r.time}</span>
        </div>
        <div class="modal-macros">
          <div class="mm"><span class="mm-val">${r.pro}g</span><span class="mm-lbl">Protein</span></div>
          <div class="mm"><span class="mm-val">${r.carb}g</span><span class="mm-lbl">Carbs</span></div>
          <div class="mm"><span class="mm-val">${r.fat}g</span><span class="mm-lbl">Fat</span></div>
          <div class="mm"><span class="mm-val">${r.cal}</span><span class="mm-lbl">Kcal</span></div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">Ingredients</div>
          ${r.ingredients.map(i=>`<div class="ingredient-item">${i}</div>`).join('')}
        </div>
        <div class="modal-section">
          <div class="modal-section-title">Steps</div>
          ${r.steps.map((s,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('')}
        </div>
        <div class="add-to-meal-row">
          <div style="font-size:.82rem;font-weight:700;color:var(--n600);width:100%;margin-bottom:.25rem;">Add to today's meals:</div>
          <button class="btn btn-outline btn-sm" onclick="addToMeal(${r.id},'breakfast')">🌅 Breakfast</button>
          <button class="btn btn-outline btn-sm" onclick="addToMeal(${r.id},'lunch')">☀️ Lunch</button>
          <button class="btn btn-outline btn-sm" onclick="addToMeal(${r.id},'dinner')">🌙 Dinner</button>
        </div>`;
      document.getElementById('modalBg').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBg').classList.remove('open');
    }

    async function addToMeal(id, type) {
      const r = RECIPES.find(x=>x.id===id);
      if (!r) return;
      try {
        await api('/meals', { method:'POST', body: JSON.stringify({
          mealType: type, foodName: r.name,
          calories: r.cal, protein: r.pro, carbs: r.carb, fat: r.fat,
          quantity: 100, date: today()
        })});
        toast(`✅ ${r.name} added to ${type}!`);
        closeModal();
      } catch(e) { toast('⚠️ '+e.message); }
    }

    async function init() {
      const user = await requireLogin();
      if (!user) return;
      injectBadge(user);
      render();
    }
    init();
  </script>
</body>
</html>
